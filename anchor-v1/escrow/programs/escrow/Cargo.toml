[package]
name = "escrow"
version = "0.1.0"
description = "Fixed-term token-swap escrow"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "=1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.1", features = ["memo"] }

[dev-dependencies]
anchor-client = "=1.2.1"
litesvm = "=0.18.2"
solana-message = "4.5"
solana-transaction = "4.2"
solana-signer = "3.0.0"
solana-keypair = "3.1.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
